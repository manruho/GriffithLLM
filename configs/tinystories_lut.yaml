# TinyStories + BPE 4096。FFN を LUT2 ×2層 + ReZero に置き換えた版
dataset: tinystories
vocab_size: 4096
out_dir: runs/tinystories_lut
batch_size: 32
max_steps: 20000
eval_every: 1000
eval_batches: 50
lr: 1.0e-3
lut_lr: 5.0e-2
warmup_steps: 500
resume: true
model:
  block_size: 256
  n_layer: 6
  n_head: 8
  d_model: 256
  ffn: lut
  lut_n_inputs: 2
  lut_depth: 2
  lut_parameterization: softmax
  # 学習時も argmax で 1 ゲートに確定させる(soft のままだと離散化後に ppl が大きく悪化する)
  lut_selection: hard_st
  lut_readout: linear
  rezero: true
